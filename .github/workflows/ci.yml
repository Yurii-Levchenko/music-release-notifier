name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a red build be re-run without an empty commit.
  workflow_dispatch:

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep this in lockstep with the version developers run locally, and with the
  # header comment in .golangci.yml. A version drift here is the classic
  # "green locally, red in CI" trap — and pinning the number alone is not
  # enough: v1 release binaries are built with Go 1.24 and refuse a module
  # targeting Go 1.26, which is exactly how this workflow failed the first time.
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy is committed
        # Catches a dependency added without tidying, which makes builds
        # non-reproducible for everyone else.
        run: |
          go mod tidy
          if ! git diff --exit-code --quiet go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit"
            git diff go.mod go.sum
            exit 1
          fi
          echo "go.mod tidy"

      - name: govulncheck
        # Known-vulnerable dependency versions, from the Go vulnerability
        # database. Pinned like everything else in this file: @latest here
        # would be the one unpinned thing in a job about pinning.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      # v9 of the action is required for golangci-lint v2. It also runs the
      # configured formatters (gofmt, goimports), so formatting is checked here
      # rather than in a separate step with its own opinion.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest

    # The database invariant tests are the ones that matter most, so CI runs a
    # real Postgres rather than letting them skip. A suite that silently skips
    # its most important assertions is worse than no suite.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: releaseradar
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: releaseradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U releaseradar -d releaseradar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # The suite migrates the schema itself (see storage TestMain), so no
      # separate migration step is needed here.
      TEST_DATABASE_URL: postgres://releaseradar:ci-throwaway@localhost:5432/releaseradar?sslmode=disable

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Fail if the database tests skipped
        # Guards against the failure mode this job exists to prevent: a broken
        # TEST_DATABASE_URL turning the invariant tests into no-ops while CI
        # still reports success.
        run: |
          output=$(go test ./internal/storage/ -count=1 -v 2>&1)
          echo "$output"
          if echo "$output" | grep -q "TEST_DATABASE_URL not set"; then
            echo "::error::database invariant tests skipped — TEST_DATABASE_URL is not reaching them"
            exit 1
          fi
          echo "database invariant tests ran"

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          {
            echo "### Coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -trimpath -o /tmp/releaseradar ./cmd/releaseradar

      - name: Build Docker image
        # Proves the Dockerfile still works, which `go build` alone does not.
        run: docker build -t releaseradar:ci .

  # Alert rules are code and can be wrong in silence: a rule that fails to
  # parse leaves Prometheus running with the rest of the file loaded and that
  # alert simply never firing. Cheaper to find here than during the incident it
  # was written for.
  alerts:
    name: Alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro"             --entrypoint promtool prom/prometheus:v3.7.3             check rules /rules/alerts.yml

      - name: promtool test rules
        # Behaviour, not syntax: each case in alerts_test.yml is a situation
        # that has happened (a dead app, a 20-day backup gap). Against the
        # rules before 08.10 the dead-app case fails — BackupStale and
        # PollerStalled fired on a stale series and said something untrue.
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.7.3 test rules alerts_test.yml

      - name: promtool check config
        # Also validates that alerts.yml is actually referenced by
        # prometheus.yml — a rules file nobody loads is worse than none.
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro"             --entrypoint promtool prom/prometheus:v3.7.3             check config /etc/prometheus/prometheus.yml

      - name: amtool check-config
        # Renders through the real entrypoint with throwaway credentials, then
        # validates the result. Checking the template directly would not work
        # and would not be worth much either: chat_id is an int64, so the
        # unrendered ${ALERT_CHAT_ID} is not even valid, and the substitution is
        # the part that can break silently. A config Alertmanager rejects means
        # the container crash-loops and every alert goes nowhere.
        run: |
          docker run --rm             -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro"             -e ALERT_BOT_TOKEN=123456:ci-not-a-real-token             -e ALERT_CHAT_ID=1             -e RENDER_ONLY=1             --entrypoint sh prom/alertmanager:v0.28.1             -c '/bin/sh /etc/alertmanager/entrypoint.sh && amtool check-config /tmp/alertmanager.yml'

  # The deploy scripts run as PID 1 or as entrypoints, where a mistake does not
  # crash anything visible: backup.sh slept through 20 days of failed dumps.
  # sh -n catches what shellcheck parses differently from busybox ash.
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD/deploy:/deploy:ro" koalaman/shellcheck:v0.10.0 -s sh /deploy/backup/backup.sh /deploy/alertmanager/entrypoint.sh /deploy/alertmanager/chat-id.sh

      - name: busybox sh -n
        run: |
          for f in deploy/backup/backup.sh deploy/alertmanager/entrypoint.sh deploy/alertmanager/chat-id.sh; do
            docker run --rm -v "$PWD/deploy:/deploy:ro" --entrypoint sh postgres:17-alpine -n "/$f" || exit 1
          done

  # The spike is a separate module and deliberately excluded from the main
  # build; check it still compiles so it does not rot before S8 deletes it.
  spike:
    name: Spike compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
        working-directory: spike/server
      - run: go build -o /dev/null ./...
        working-directory: spike/server
