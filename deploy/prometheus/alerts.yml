# Thresholds from SPEC §15a. They are starting points, to be corrected after
# the first Friday with real data (C36: Friday is 48.5% of releases and 5.6x an
# average day, so a threshold tuned on a Tuesday will cry wolf on a Friday).
#
# Severity is about what the reader has to do, not how bad it sounds:
#
#   critical — people are not being notified right now, or are losing data
#              right now, and it will not heal on its own. Repeats hourly.
#   warning  — something degrades over hours or days and wants fixing today.
#              Repeats once a day.
#
# BackupStale was critical until 08.10. It was always true when it fired —
# backups really had failed for 20 days — but a backup that is two days old is
# a today problem, not a this-minute one, and an hourly repeat turned one true
# alert into ~134 messages in 21 days. That is how the next real one gets
# swiped away.
#
# The machine being down is not here, and cannot be: a Prometheus on the same
# machine dies with it. That is the external dead-man's switch's job (S6.1).
# The app being down while Prometheus runs is here — see AppDown.
groups:
  - name: releaseradar
    rules:
      - alert: AppDown
        # Prometheus sees a dead app perfectly well: up drops to 0. Before this
        # rule a crashed app surfaced 30 minutes later as PollerStalled and
        # BackupStale, both saying something untrue ("no poll in 25 hours"),
        # because their absent() clauses fired once the series went stale.
        # Those clauses are now guarded on up == 1, so a dead app reports as
        # exactly one alert that says what happened.
        #
        # 3 minutes: on boot the app loses the race to a database that is still
        # starting and restarts for ~20 s; that is not an incident.
        expr: up{job="releaseradar"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: The app is down
          description: >-
            Prometheus cannot scrape it. Nothing is being polled, delivered or
            answered. Check `docker compose ps` and the app's logs.

      - alert: HeartbeatDisabled
        # Running without the dead-man's switch is allowed (HEARTBEAT_DISABLED=1,
        # for development) but must not go unnoticed: it is the only alarm that
        # survives the whole machine going down.
        expr: releaseradar_heartbeat_enabled == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The external dead-man's switch is off
          description: >-
            HEARTBEAT_DISABLED=1 is set, so nothing outside this machine will
            notice if it dies. Set HEARTBEAT_URL in .env.

      - alert: QueueNotReadable
        expr: releaseradar_queue_readable == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The outbox cannot be read
          description: >-
            The queue collector could not query Postgres for 2 minutes.
            Nothing is being delivered.

      - alert: QueueBacklogAgeing
        # The age of the oldest waiting item is the delay a person is actually
        # experiencing, which is why it is the alert rather than depth.
        expr: releaseradar_notification_queue_age_seconds > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A notification has been waiting over an hour

      - alert: QueueGrowing
        # Depth rising across three evaluation windows means arrivals are
        # outpacing delivery, which shows up before any latency does.
        expr: delta(releaseradar_notifications_pending[15m]) > 0
        for: 45m
        labels:
          severity: warning
        annotations:
          summary: The outbox has grown for 45 minutes without draining

      - alert: TelegramThrottling
        # A 429 share above 10% means the pacing is wrong, not that Telegram is
        # unhappy about one message.
        expr: >-
          sum(rate(releaseradar_telegram_requests_total{code="429"}[15m]))
          /
          sum(rate(releaseradar_telegram_requests_total[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Over 10% of Telegram requests are rate limited

      - alert: PollerStalled
        # 25 hours, not 24: a poller that ran 24h01m ago is on time, and an
        # alert that fires on a punctual daily job gets muted within a week.
        #
        # The timestamp comes from the database rather than from process
        # memory, so a deploy does not reset it. The absent() clause covers the
        # other case: the metric disappears when the poller has never
        # succeeded, and "never ran" must alert as loudly as "stopped running" —
        # but only while the app is up; a dead app is AppDown's to report.
        #
        # Warning, not critical: the feed is read with a 7-day window, so a
        # poll that resumes within the week loses nothing — releases arrive
        # late, not never.
        expr: >-
          (time() - releaseradar_poller_last_success_timestamp_seconds > 90000)
          or (absent(releaseradar_poller_last_success_timestamp_seconds) and on() up{job="releaseradar"} == 1)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No successful poll in over 25 hours
          description: >-
            New releases are not being detected, so notifications are late. The
            7-day window means nothing is lost if polling resumes this week.

      - alert: BackupStale
        # 48 hours, where the poller gets 25, and the gap is a consequence of a
        # decision rather than a guess: there is no VPS yet (Q-OPEN-4, deferred
        # 15.09.2026), so this runs on a laptop that sleeps overnight and is
        # shut at weekends. A 26-hour threshold would fire every Monday, and an
        # alert that is wrong every Monday is an alert nobody reads by March.
        # Tighten it to 26h the day this moves to a machine that stays on.
        #
        # absent() is the half that matters most. A missing metric means the
        # directory could not be read or BACKUP_DIR was never set — and "there
        # are no backups at all" has to be at least as loud as "the backups are
        # old". Guarded on up == 1: the metric is published by the app, so a
        # dead app makes it absent too, and that is AppDown's to report.
        #
        # Warning: nothing is lost while it fires, only exposed. A daily repeat
        # is enough to get it fixed; an hourly one was enough to get it ignored.
        expr: >-
          (time() - releaseradar_backup_last_success_timestamp_seconds > 172800)
          or (absent(releaseradar_backup_last_success_timestamp_seconds) and on() up{job="releaseradar"} == 1)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No verified database backup in over 48 hours
          description: >-
            Every subscription, artist and release lives in one Postgres volume
            on one machine. Check `docker compose logs backup`.

      - alert: BackupRotationStuck
        # Rotation only runs after a successful dump, which is deliberate — a
        # failing job must never delete the last good backup it has. The cost of
        # that choice is the opposite failure: if the prune step itself breaks,
        # nothing bounds the directory, and a full disk takes down the database
        # it was protecting.
        expr: releaseradar_backups_retained > 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: More dumps are being kept than rotation should allow

      - alert: AlertDeliveryFailing
        # The one alert that cannot reach you by the route it is describing: if
        # Telegram delivery is broken, this notification takes the broken path
        # too. It is here anyway, because the counter still reaches Prometheus
        # and the dashboard, so "alerting has been silently dead for a week"
        # becomes something visible rather than something discovered during the
        # next incident.
        #
        # absent() is the other half. A missing metric means Alertmanager is not
        # being scraped at all — it refused to start for want of a bot token, or
        # it is not running — and "no alerting configured" must be as loud as
        # "alerting is erroring".
        expr: >-
          (sum(rate(alertmanager_notifications_failed_total[15m])) > 0)
          or absent(alertmanager_notifications_total)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Alert delivery is failing, or Alertmanager is not running
          description: >-
            Alerts are being evaluated but may not be reaching anybody. Check
            the alert bot token and that the alertmanager container is up.

      - alert: PermanentFailuresSpiking
        # Permanent means somebody's subscriptions were deleted. A handful is
        # normal churn; a spike means we are deleting subscriptions we should
        # not be, which is unrecoverable for the user.
        expr: sum(increase(releaseradar_notifications_total{disposition="permanent"}[1h])) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 5 recipients dropped in an hour
          description: >-
            Each of these deleted a user's subscriptions. Check the
            classification table before this runs any longer.
