# Scrapes the app over the compose network. /metrics is never published to the
# host, so queue depths and chat volumes are not readable from outside.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: releaseradar
    static_configs:
      - targets: ["app:8080"]
