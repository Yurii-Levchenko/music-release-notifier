services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-releaseradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-releaseradar}
    ports:
      # Host port is 5433, NOT 5432: this machine runs a native PostgreSQL
      # service that already owns 5432. The app container still talks to
      # db:5432 over the compose network, so only host access is remapped.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app runs migrations at boot, so it must not start before Postgres
      # is genuinely accepting connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-releaseradar} -d ${POSTGRES_DB:-releaseradar}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-releaseradar}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-releaseradar}?sslmode=disable
      HTTP_ADDR: ":8080"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      USER_AGENT: ${USER_AGENT:-ReleaseRadar/0.1 ( unset@example.com )}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-5m}
      # The app does not make backups; it reports on them, so the freshness of
      # the dumps is a metric with an alert rather than something you remember
      # to check by listing a directory.
      BACKUP_DIR: /backups
    volumes:
      # Read-only. Nothing in the app should be able to touch a backup, and a
      # process that can delete its own backups is one bug away from having
      # none.
      - ./backups:/backups:ro
    ports:
      # Host port 8090, not 8080. 8080 is the most contended port on any dev
      # machine, and losing the race for it on a host restart kills the
      # container before it runs — see the note in CLAUDE.md.
      - "8090:8080"

  # Not behind the observability profile, on purpose: metrics are something you
  # look at, and backups are the thing that decides whether there is anything
  # left to look at. It runs whenever the database does.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-releaseradar}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      PGDATABASE: ${POSTGRES_DB:-releaseradar}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
    # Same image as the database, which is the point: pg_dump must never be
    # older than the server it dumps. Pinning a separate image would let the two
    # drift on the next Postgres bump, and the direction that fails silently is
    # the one that produces an archive you find out about during a restore.
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      # A bind mount rather than a named volume. Named volumes are removed by
      # `docker compose down -v`, which people run, and the whole value of a
      # backup on a laptop is being able to copy it somewhere that is not the
      # laptop. Gitignored.
      - ./backups:/backups

  # Observability lives behind a profile, so `docker compose up` stays two
  # containers on a dev machine. Start it with:
  #   docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    # No published port, on purpose. Grafana reaches Prometheus over the
    # compose network, so publishing it bought nothing and cost a failure
    # mode: on 04.09.2026 this container exited 255 with "Bind for
    # 0.0.0.0:9091 failed: port is already allocated" and stayed dead for six
    # days. The same race that killed the app on 8080 - the failure happens
    # while Docker sets up networking, before the process starts, so
    # restart: unless-stopped never applies. Every port not published is one
    # fewer way for that to happen.
    #
    # To reach the Prometheus UI when you actually want it:
    #   docker compose exec prometheus wget -qO- localhost:9090/api/v1/rules
    # or query it through Grafana, which provisions it as the default source.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:12.3.1
    profiles: ["observability"]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      # Anonymous read-only viewing: this is a single-operator deployment, and
      # a password nobody remembers is a dashboard nobody opens.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Without this a Viewer has datasources:query but not datasources:explore,
      # so Explore is missing from the nav entirely — which is how a stack with
      # working logs looks like a stack with no logs. Viewers still cannot save
      # anything; the edits are per-session.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      # Bound to the loopback address. Anonymous access with edit rights has no
      # business being reachable from the rest of the network, and "3001:3000"
      # publishes on every interface.
      - "127.0.0.1:3001:3000"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      # A second bot, not the one users talk to. An alert about the main bot
      # being blocked, throttled or misconfigured cannot be sent by the main
      # bot.
      ALERT_BOT_TOKEN: ${ALERT_BOT_TOKEN:-}
      ALERT_CHAT_ID: ${ALERT_CHAT_ID:-}
      # Alert messages print UTC and this zone side by side. A zone name rather
      # than a fixed offset, so the October and March switches happen on their
      # own and the printed abbreviation stays true — CEST now, CET later.
      # Only this container is affected; everything else stays UTC.
      TZ: ${ALERT_TZ:-Europe/Warsaw}
    # Alertmanager does not substitute environment variables into its config, so
    # a shell renders the template first. Invoked as `sh <script>` rather than
    # relying on the execute bit, which a Windows checkout does not preserve.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      # Silences and the notification log. Without this, restarting the
      # container re-sends everything that was already delivered and forgets
      # every silence somebody set during an incident.
      - alertmanagerdata:/alertmanager
    # Not published, for the same reason as Prometheus and Loki: Prometheus
    # reaches it over the compose network, and an unauthenticated endpoint that
    # can silence alerts has no business on the host.
    #
    # Unlike Loki, this healthcheck is real — the image is busybox-based and
    # genuinely has wget, so a failing probe means a failing Alertmanager rather
    # than a missing binary.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.7.7
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/loki:/etc/loki:ro
      - lokidata:/loki
    # Not published. Grafana and Alloy reach it over the compose network, and
    # an unauthenticated log store on the host is a worse idea than an
    # unauthenticated metrics endpoint.
    #
    # No healthcheck. The image carries the loki binary and nothing else — no
    # wget, no curl, no shell tools — so every probe that can be written here
    # fails regardless of whether Loki is fine, and reports "unhealthy" forever.
    # A check that can only ever say the wrong thing is worse than none: the
    # first time it matters, it will already have been ignored for weeks.

  alloy:
    image: grafana/alloy:v1.19.2
    profiles: ["observability"]
    restart: unless-stopped
    depends_on: [loki]
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/alloy:/etc/alloy:ro
      - alloydata:/var/lib/alloy/data
      # Read-only, and it is the whole reason this works on Docker Desktop:
      # container logs live inside the VM, so they are read through the API
      # rather than from a bind-mounted directory that does not exist here.
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  lokidata:
  alloydata:
  promdata:
  grafanadata:
  alertmanagerdata:
